[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spurious-correlations-in-ai"
version = "0.1.0"
description = "Hunting time-series correlations between AI model releases and the rise of AI-slop vocabulary in human discourse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Alberts" }]
keywords = ["ai", "llm", "spurious-correlations", "linguistics", "data-science", "gptzero"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.31",
    "pyyaml>=6.0",
    "ruptures>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spurcorr = "spurcorr.pipeline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["spurcorr*"]

[tool.setuptools.package-data]
spurcorr = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
