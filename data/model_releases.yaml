# Curated timeline of major public AI model releases.
#
# Sources: official lab blogs, Wikipedia, llm-stats.com, llm-timeline.com.
# Dates are the public-availability date (not the paper/preprint date).
# `family` groups versions for cross-model synchrony analysis.
# Keep this list to *major* releases that plausibly move public discourse;
# minor point releases add noise to the changepoint analysis.

releases:
  # --- OpenAI ---
  - date: 2020-06-11
    lab: OpenAI
    model: GPT-3 (API beta)
    family: gpt
  - date: 2022-11-30
    lab: OpenAI
    model: ChatGPT
    family: gpt
    landmark: true        # the inflection point most of the literature anchors on
  - date: 2023-03-14
    lab: OpenAI
    model: GPT-4
    family: gpt
    landmark: true
  - date: 2024-05-13
    lab: OpenAI
    model: GPT-4o
    family: gpt
  - date: 2024-09-12
    lab: OpenAI
    model: o1
    family: gpt
  - date: 2025-08-07
    lab: OpenAI
    model: GPT-5
    family: gpt

