name: weekly

# Saturday 14:00 UTC — refresh data, charts, catalog, and README; commit to main.
on:
  schedule:
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run weekly pipeline
        run: python -m spurcorr.pipeline --notes "weekly ${{ github.run_id }}"

      - name: Commit refreshed outputs to main
        run: |
          git config user.name  "spurcorr-bot"
          git config user.email "actions@github.com"
          git add README.md docs/charts data/catalog data/raw data/ai_vocabulary.yaml
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "weekly: refresh correlations $(date +%F)"
            git push origin HEAD:main
          fi
